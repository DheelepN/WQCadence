[project]
name = "wqcadence"
version = "1.0.0"
description = "Adaptive sampling, fault-aware discrimination and source localization for river water-quality surveillance"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.8", "joblib>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8"]
paper = ["python-docx>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: integration tests that run small versions of the experiments"]
